services:
  - type: web
    name: faceprep-backend
    runtime: node
    rootDir: faceprep-backend
    buildCommand: npm install --build-from-source
    startCommand: node src/server.js
    healthCheckPath: /api/health
    disk:
      name: faceprep-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        sync: false